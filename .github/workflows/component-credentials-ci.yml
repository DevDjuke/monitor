name: component-credentials-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  component-credentials:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: MonitorCredentialCi!2026Password
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MonitorCredentialCi!2026Password' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore

      - name: Exercise component-scoped credentials, rotation, revocation, and OTLP scope
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5086
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=MonitorCredentialCi;User Id=sa;Password=MonitorCredentialCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-bootstrap-ingestion-key
          Monitor__BootstrapAdmin__Email: credential-ci@monitor.local
          Monitor__BootstrapAdmin__Password: MonitorCredentialAdmin2026
          Retention__Enabled: false
          FailureAlerting__Enabled: false
          AlertDelivery__Enabled: false
        run: |
          set -euo pipefail

          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef database update \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext \
            --connection "$ConnectionStrings__Monitor"

          sql_container=$(docker ps \
            --filter 'ancestor=mcr.microsoft.com/mssql/server:2022-latest' \
            --format '{{.ID}}' | head -n 1)
          test -n "$sql_container"

          (
            cd src/Monitor.Web
            exec dotnet bin/Release/net10.0/Monitor.Web.dll
          ) > /tmp/monitor-credential-ci.log 2>&1 &
          app_pid=$!

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "=== Monitor credential log ==="
              cat /tmp/monitor-credential-ci.log 2>/dev/null || true
              echo "=== End diagnostic log ==="
            fi
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            return "$status"
          }
          trap cleanup EXIT

          app_ready=false
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:5086/api/health > /dev/null; then
              app_ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Monitor exited while starting."
              wait "$app_pid" || true
              exit 1
            fi
            sleep 1
          done
          test "$app_ready" = true

          register_component() {
            local name="$1"
            local slug="$2"
            local environment="$3"
            curl -fsS \
              -H 'X-Monitor-Key: ci-bootstrap-ingestion-key' \
              -H 'Content-Type: application/json' \
              -d "{\"name\":\"$name\",\"slug\":\"$slug\",\"type\":\"Agent\",\"environment\":\"$environment\",\"version\":\"1.0.0\"}" \
              http://127.0.0.1:5086/api/components/register
          }

          component_a_json=$(register_component 'OTLP Sample Auditor' 'monitor-samples-otlp-sample-auditor' 'development')
          component_b_json=$(register_component 'Credential Agent B' 'credential-agent-b' 'development')
          component_a_id=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["id"])' <<< "$component_a_json")
          component_b_id=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["id"])' <<< "$component_b_json")
          test -n "$component_a_id"
          test -n "$component_b_id"
          test "$component_a_id" != "$component_b_id"

          curl -fsS -c /tmp/monitor-credential-cookies.txt \
            http://127.0.0.1:5086/account/login \
            -o /tmp/monitor-credential-login.html

          login_token=$(python3 -c '
          import re
          html = open("/tmp/monitor-credential-login.html", encoding="utf-8").read()
          match = re.search(r"name=\"__RequestVerificationToken\"[^>]*value=\"([^\"]+)\"", html)
          assert match, "login antiforgery token not found"
          print(match.group(1))
          ')

          login_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -b /tmp/monitor-credential-cookies.txt \
            -c /tmp/monitor-credential-cookies.txt \
            --data-urlencode "__RequestVerificationToken=$login_token" \
            --data-urlencode 'Input.Email=credential-ci@monitor.local' \
            --data-urlencode 'Input.Password=MonitorCredentialAdmin2026' \
            --data-urlencode 'Input.RememberMe=false' \
            http://127.0.0.1:5086/account/login)
          test "$login_status" = "302"

          get_page_token() {
            local url="$1"
            local output="$2"
            curl -fsS -b /tmp/monitor-credential-cookies.txt "$url" -o "$output"
            python3 - "$output" <<'PY'
          import re
          import sys
          html = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"', html)
          assert match, f"antiforgery token not found in {sys.argv[1]}"
          print(match.group(1))
          PY
          }

          issue_credential() {
            local component_id="$1"
            local name="$2"
            local output="$3"
            local token
            token=$(get_page_token "http://127.0.0.1:5086/components/$component_id" "/tmp/${output}-before.html")
            local status
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -b /tmp/monitor-credential-cookies.txt \
              -c /tmp/monitor-credential-cookies.txt \
              --data-urlencode "__RequestVerificationToken=$token" \
              --data-urlencode "CredentialInput.Name=$name" \
              "http://127.0.0.1:5086/components/$component_id?handler=CreateCredential")
            test "$status" = "302"
            curl -fsS -b /tmp/monitor-credential-cookies.txt \
              "http://127.0.0.1:5086/components/$component_id" \
              -o "/tmp/${output}-issued.html"
            grep -q 'COPY NOW' "/tmp/${output}-issued.html"
            grep -q 'stores only its SHA-256 hash' "/tmp/${output}-issued.html"
            python3 - "/tmp/${output}-issued.html" <<'PY'
          import re
          import sys
          html = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r'mon_c_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', html)
          assert match, "one-time component key not found"
          print(match.group(0))
          PY
          }

          component_a_key=$(issue_credential "$component_a_id" 'CI component A key' 'component-a')
          component_b_key=$(issue_credential "$component_b_id" 'CI component B key' 'component-b')
          test "$component_a_key" != "$component_b_key"

          credential_schema_state=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCredentialCi!2026Password' -C -b -d MonitorCredentialCi -h -1 -W \
            -Q "
              SET NOCOUNT ON;
              SELECT CONCAT(
                (SELECT COUNT(*) FROM ComponentIngestionCredentials WHERE ComponentId = '$component_a_id' AND RevokedAt IS NULL AND DATALENGTH(KeyHash) = 32), N'|',
                (SELECT COUNT(*) FROM ComponentIngestionCredentials WHERE ComponentId = '$component_b_id' AND RevokedAt IS NULL AND DATALENGTH(KeyHash) = 32), N'|',
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = N'ComponentIngestionCredentials' AND COLUMN_NAME LIKE N'%Secret%')
              );
            " | tr -d '\r' | xargs)
          test "$credential_schema_state" = "1|1|0"

          # A scoped key can see and mutate A, but not B.
          curl -fsS -H "X-Monitor-Key: $component_a_key" \
            http://127.0.0.1:5086/api/components \
            -o /tmp/component-a-visible.json
          python3 - "$component_a_id" "$component_b_id" <<'PY'
          import json
          import sys
          rows = json.load(open('/tmp/component-a-visible.json', encoding='utf-8'))
          assert len(rows) == 1
          assert rows[0]['id'].lower() == sys.argv[1].lower()
          assert all(row['id'].lower() != sys.argv[2].lower() for row in rows)
          PY

          own_register_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "X-Monitor-Key: $component_a_key" \
            -H 'Content-Type: application/json' \
            -d '{"name":"OTLP Sample Auditor","slug":"monitor-samples-otlp-sample-auditor","type":"Agent","environment":"development","version":"1.0.1"}' \
            http://127.0.0.1:5086/api/components/register)
          test "$own_register_status" = "200"

          cross_register_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "X-Monitor-Key: $component_a_key" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Credential Agent B","slug":"credential-agent-b","type":"Agent","environment":"development","version":"1.0.1"}' \
            http://127.0.0.1:5086/api/components/register)
          test "$cross_register_status" = "403"

          own_heartbeat=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H "X-Monitor-Key: $component_a_key" \
            "http://127.0.0.1:5086/api/components/$component_a_id/heartbeat")
          cross_heartbeat=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H "X-Monitor-Key: $component_a_key" \
            "http://127.0.0.1:5086/api/components/$component_b_id/heartbeat")
          test "$own_heartbeat" = "204"
          test "$cross_heartbeat" = "403"

          own_run_json=$(curl -fsS \
            -H "X-Monitor-Key: $component_a_key" \
            -H 'Content-Type: application/json' \
            -d "{\"componentId\":\"$component_a_id\",\"name\":\"component credential run\",\"externalId\":\"credential-ci-1\",\"trigger\":\"CI\",\"model\":null,\"inputJson\":\"{}\"}" \
            http://127.0.0.1:5086/api/runs)
          own_run_id=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["id"])' <<< "$own_run_json")
          test -n "$own_run_id"

          cross_run_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "X-Monitor-Key: $component_a_key" \
            -H 'Content-Type: application/json' \
            -d "{\"componentId\":\"$component_b_id\",\"name\":\"forbidden run\",\"externalId\":null,\"trigger\":\"CI\",\"model\":null,\"inputJson\":null}" \
            http://127.0.0.1:5086/api/runs)
          test "$cross_run_status" = "403"

          query_cross_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "X-Monitor-Key: $component_a_key" \
            "http://127.0.0.1:5086/api/runs/query?componentId=$component_b_id")
          test "$query_cross_status" = "403"

          curl -fsS -H "X-Monitor-Key: $component_a_key" \
            "http://127.0.0.1:5086/api/runs/$own_run_id" \
            -o /tmp/component-a-run.json

          span_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "X-Monitor-Key: $component_a_key" \
            -H 'Content-Type: application/json' \
            -d '{"parentSpanId":null,"name":"credential span","kind":"Internal","status":"Success","startedAt":null,"completedAt":null,"attributesJson":"{}","error":null}' \
            "http://127.0.0.1:5086/api/runs/$own_run_id/spans")
          test "$span_status" = "201"

          complete_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "X-Monitor-Key: $component_a_key" \
            -H 'Content-Type: application/json' \
            -d '{"status":"Success","inputTokens":0,"outputTokens":0,"costUsd":0,"outputJson":"{}","error":null}' \
            "http://127.0.0.1:5086/api/runs/$own_run_id/complete")
          test "$complete_status" = "204"

          used_state=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCredentialCi!2026Password' -C -b -d MonitorCredentialCi -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ComponentIngestionCredentials WHERE ComponentId = '$component_a_id' AND LastUsedAt IS NOT NULL;" \
            | tr -d '\r' | xargs)
          test "$used_state" = "1"

          # A's component key is accepted by the standard OTLP exporter because its resource
          # resolves to A's slug + environment.
          Monitor__BaseUrl=http://127.0.0.1:5086 \
          Monitor__IngestionApiKey="$component_a_key" \
            dotnet samples/Monitor.OtlpSampleWorker/bin/Release/net10.0/Monitor.OtlpSampleWorker.dll

          otlp_a_count=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCredentialCi!2026Password' -C -b -d MonitorCredentialCi -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM Runs WHERE ComponentId = '$component_a_id' AND [Trigger] = N'OTLP';" \
            | tr -d '\r' | xargs)
          test "$otlp_a_count" = "3"

          # B's valid key cannot submit A's OTLP resource. The exporter may report the 403
          # without failing its process, so prove the import count did not move.
          Monitor__BaseUrl=http://127.0.0.1:5086 \
          Monitor__IngestionApiKey="$component_b_key" \
            dotnet samples/Monitor.OtlpSampleWorker/bin/Release/net10.0/Monitor.OtlpSampleWorker.dll || true

          otlp_after_cross=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCredentialCi!2026Password' -C -b -d MonitorCredentialCi -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT CONCAT((SELECT COUNT(*) FROM Runs WHERE ComponentId = '$component_a_id' AND [Trigger] = N'OTLP'), N'|', (SELECT COUNT(*) FROM Runs WHERE ComponentId = '$component_b_id' AND [Trigger] = N'OTLP'));" \
            | tr -d '\r' | xargs)
          test "$otlp_after_cross" = "3|0"

          component_a_credential_id=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCredentialCi!2026Password' -C -b -d MonitorCredentialCi -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT CONVERT(nvarchar(36), Id) FROM ComponentIngestionCredentials WHERE ComponentId = '$component_a_id' AND RevokedAt IS NULL;" \
            | tr -d '\r' | xargs)
          test -n "$component_a_credential_id"

          rotate_token=$(get_page_token "http://127.0.0.1:5086/components/$component_a_id" /tmp/component-a-rotate.html)
          rotate_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -b /tmp/monitor-credential-cookies.txt \
            -c /tmp/monitor-credential-cookies.txt \
            --data-urlencode "__RequestVerificationToken=$rotate_token" \
            "http://127.0.0.1:5086/components/$component_a_id?handler=RotateCredential&credentialId=$component_a_credential_id")
          test "$rotate_status" = "302"

          curl -fsS -b /tmp/monitor-credential-cookies.txt \
            "http://127.0.0.1:5086/components/$component_a_id" \
            -o /tmp/component-a-rotated.html
          replacement_key=$(python3 - <<'PY'
          import re
          html = open('/tmp/component-a-rotated.html', encoding='utf-8').read()
          match = re.search(r'mon_c_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', html)
          assert match, 'replacement key not found'
          print(match.group(0))
          PY
          )
          test "$replacement_key" != "$component_a_key"

          old_after_rotate=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H "X-Monitor-Key: $component_a_key" \
            "http://127.0.0.1:5086/api/components/$component_a_id/heartbeat")
          replacement_heartbeat=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H "X-Monitor-Key: $replacement_key" \
            "http://127.0.0.1:5086/api/components/$component_a_id/heartbeat")
          test "$old_after_rotate" = "401"
          test "$replacement_heartbeat" = "204"

          replacement_id=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCredentialCi!2026Password' -C -b -d MonitorCredentialCi -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT CONVERT(nvarchar(36), Id) FROM ComponentIngestionCredentials WHERE ComponentId = '$component_a_id' AND RevokedAt IS NULL;" \
            | tr -d '\r' | xargs)
          test -n "$replacement_id"
          test "$replacement_id" != "$component_a_credential_id"

          revoke_token=$(get_page_token "http://127.0.0.1:5086/components/$component_a_id" /tmp/component-a-revoke.html)
          revoke_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -b /tmp/monitor-credential-cookies.txt \
            -c /tmp/monitor-credential-cookies.txt \
            --data-urlencode "__RequestVerificationToken=$revoke_token" \
            "http://127.0.0.1:5086/components/$component_a_id?handler=RevokeCredential&credentialId=$replacement_id")
          test "$revoke_status" = "302"

          revoked_heartbeat=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H "X-Monitor-Key: $replacement_key" \
            "http://127.0.0.1:5086/api/components/$component_a_id/heartbeat")
          test "$revoked_heartbeat" = "401"

          rotation_state=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCredentialCi!2026Password' -C -b -d MonitorCredentialCi -h -1 -W \
            -Q "
              SET NOCOUNT ON;
              SELECT CONCAT(
                (SELECT COUNT(*) FROM ComponentIngestionCredentials WHERE ComponentId = '$component_a_id'), N'|',
                (SELECT COUNT(*) FROM ComponentIngestionCredentials WHERE ComponentId = '$component_a_id' AND RevokedAt IS NOT NULL AND RevokedBy = N'credential-ci@monitor.local'), N'|',
                (SELECT COUNT(*) FROM ComponentIngestionCredentials WHERE ComponentId = '$component_a_id' AND RevokedAt IS NULL)
              );
            " | tr -d '\r' | xargs)
          test "$rotation_state" = "2|2|0"

          # Bootstrap credential remains a privileged migration/setup path.
          bootstrap_heartbeat=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'X-Monitor-Key: ci-bootstrap-ingestion-key' \
            "http://127.0.0.1:5086/api/components/$component_b_id/heartbeat")
          test "$bootstrap_heartbeat" = "204"

          curl -fsS -b /tmp/monitor-credential-cookies.txt \
            "http://127.0.0.1:5086/components/$component_a_id" \
            -o /tmp/component-a-final.html
          grep -q 'INGESTION CREDENTIALS' /tmp/component-a-final.html
          grep -q 'Revoked' /tmp/component-a-final.html
          grep -q 'CI component A key' /tmp/component-a-final.html
