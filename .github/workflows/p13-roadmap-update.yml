name: p13-roadmap-update

on:
  push:
    branches: [feature/otlp-metrics]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/otlp-metrics
      - name: Mark P13 complete
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/roadmap.md')
          s=p.read_text()
          s=s.replace(
            '- Monitor-native ingestion plus OTLP/HTTP protobuf trace and log ingestion.',
            '- Monitor-native ingestion plus OTLP/HTTP protobuf trace, log, and metric ingestion.')
          old='''### 13. OTLP metrics\n\nStatus: **planned**\n\n- Add metrics as the next observability signal: counters, gauges, histograms, queue depth, saturation, and custom agent metrics.\n- Keep the domain/import pipeline protocol-independent so metrics do not create a transport-specific parallel model.\n'''
          new='''### 13. OTLP metrics\n\nStatus: **complete**\n\n- Add a protocol-independent durable metric-point model for gauges, monotonic/non-monotonic sums, explicit histograms, exponential histograms, and legacy summaries.\n- Accept OTLP/HTTP protobuf metrics at `/v1/metrics` with the same shared/component-scoped machine-authentication contract as traces and logs.\n- Preserve temporality, monotonicity, units, dimensions, resource/scope metadata, schema URLs, exemplars, histogram buckets/bounds, exponential bucket parameters, and summary quantiles without silently reinterpreting source aggregation semantics.\n- Preserve OTLP unsigned 64-bit distribution counts with SQL `decimal(20,0)` rather than narrowing them to signed `bigint`.\n- Reject malformed individual points through OTLP partial-success while retaining valid siblings in the same request.\n- Deduplicate exporter retries with a stable semantic SHA-256 point identity plus a database unique constraint.\n- Add a filtered `/metrics` operator surface and make Metrics a first-class personal Saved Views surface.\n- Bound raw metric detail retention with `Retention:MetricDetailDays` (30 days by default) and the existing retention worker; defer rollups/downsampling until measured volume justifies them.\n- Add a permanent SQL Server-backed integration gate covering component scope, invalid auth/content types, five metric kinds, malformed-point partial success, exact retry dedupe, stored distribution/resource/exemplar fidelity, Metrics Saved Views, UI filtering, and retention.\n- Keep OTLP/gRPC and OTLP/HTTP JSON transport expansion in P14 so both reuse the same importer/domain path.\n- Detailed contract: `docs/otlp-metrics.md`.\n'''
          if old not in s:
            raise SystemExit('P13 roadmap block not found')
          p.write_text(s.replace(old,new))
      - name: Commit roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/roadmap.md
          git commit -m 'P13 mark OTLP metrics complete in roadmap'
          git push origin HEAD:feature/otlp-metrics
