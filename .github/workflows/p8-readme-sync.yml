name: p8-readme-sync

on:
  push:
    branches: [feature/richer-live-experience]
    paths: [.github/workflows/p8-readme-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-live-experience
          fetch-depth: 0
      - name: Synchronize README for P8
        shell: python
        run: |
          from pathlib import Path

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')

          old_live = '- SignalR-backed live run updates: the latest page refreshes automatically while older history remains stable.'
          new_live = old_live + '\n- Live run drill-down with authenticated per-run SignalR groups, incremental span/log reconciliation, continuously updating active durations, reconnect recovery, and explicit frozen terminal-history behavior.'
          if old_live not in text:
              raise SystemExit('Run live feature anchor not found')
          text = text.replace(old_live, new_live, 1)

          old_commands = '- `/commands` cross-component command history plus component-scoped issuance and cancellation.'
          new_commands = old_commands + '\n- Live command transitions on central and component history surfaces without silently destabilizing filtered or historical views.'
          if old_commands not in text:
              raise SystemExit('Command feature anchor not found')
          text = text.replace(old_commands, new_commands, 1)

          old_ci = '- GitHub Actions SQL Server-backed integration tests for telemetry, traces, logs, migration upgrades, keyset pagination, credentials, failure grouping, alert evaluation, signed webhook delivery, budgets, leased component commands, personal saved-view ownership/canonicalization, retention safety, and audit atomicity/secret exclusion.'
          new_ci = '- GitHub Actions SQL Server-backed integration tests for telemetry, traces, logs, migration upgrades, keyset pagination, credentials, failure grouping, alert evaluation, signed webhook delivery, budgets, leased component commands, personal saved-view ownership/canonicalization, richer live run/command behavior, retention safety, and audit atomicity/secret exclusion.'
          if old_ci not in text:
              raise SystemExit('CI feature anchor not found')
          text = text.replace(old_ci, new_ci, 1)

          docs_anchor = '  saved-views.md\n'
          if docs_anchor not in text:
              raise SystemExit('Docs anchor not found')
          if '  richer-live-experience.md\n' not in text:
              text = text.replace(docs_anchor, docs_anchor + '  richer-live-experience.md\n', 1)

          old_roadmap = 'The maintained implementation sequence is in `docs/roadmap.md`. Saved views are now complete alongside the core observability, policy, audit, credential, and command-control slices. We intentionally reevaluate the next product priority before starting the richer live-experience work.'
          new_roadmap = 'The maintained implementation sequence is in `docs/roadmap.md`. Saved views and the richer live run/command experience are complete alongside the core observability, policy, audit, credential, and command-control slices. The next platform priority should be reevaluated against the remaining later-platform work.'
          if old_roadmap not in text:
              raise SystemExit('Roadmap summary anchor not found')
          text = text.replace(old_roadmap, new_roadmap, 1)

          p.write_text(text, encoding='utf-8')
      - name: Commit README sync and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p8-readme-sync.yml
          git add README.md
          git commit -m "docs: document richer live experience in README"
          git push origin HEAD:feature/richer-live-experience
