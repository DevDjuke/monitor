name: p6-doc-sync
on:
  push:
    branches: [feature/component-control-commands]
    paths: [.github/workflows/p6-doc-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/component-control-commands
          fetch-depth: 0
      - name: Sync P6 docs and operator wording
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/Monitor.Web/Pages/ComponentDetail.cshtml",
              'Component keys can only submit or read telemetry belonging to <strong>@component.Name</strong> in <strong>@component.Environment</strong>. A disabled component cannot use the key for normal telemetry, but it may still poll the control endpoint so it can receive Enable.',
              'Component keys can only submit or read telemetry belonging to <strong>@component.Name</strong> in <strong>@component.Environment</strong>. Workload Pause/Disable commands keep telemetry and command polling available; registry disabling or credential revocation remains a hard ingestion-authentication boundary.'
          )

          replace_once(
              "README.md",
              "MonitoredComponent\n  ├─ LogEvent\n  └─ AgentRun",
              "MonitoredComponent\n  ├─ LogEvent\n  ├─ ComponentCommand\n  └─ AgentRun"
          )
          replace_once(
              "README.md",
              "- `/usage` retention, aggregate, and recurring-failure dashboard without double-counting retained raw runs.",
              "- `/usage` retention, aggregate, and recurring-failure dashboard without double-counting retained raw runs.\n- Daily/monthly cost and token budgets with warning/critical threshold events and durable delivery.\n- Durable leased component commands with Pause/Resume, Disable/Enable, Restart, KillRun, and RefreshConfiguration semantics.\n- `/commands` cross-component command history plus component-scoped issuance and cancellation.\n- Server-side run admission enforcement for Paused/Disabled workload control state."
          )
          replace_once(
              "README.md",
              "- `Monitor.Client` .NET SDK for registration, heartbeats, runs, spans, structured events, completion, cancellation, and API errors.",
              "- `Monitor.Client` .NET SDK for registration, heartbeats, runs, spans, structured events, completion, cancellation, and API errors.\n- `MonitorControlClient` .NET SDK for leased command polling and explicit success/failure/rejection acknowledgement."
          )
          replace_once(
              "README.md",
              "- `Monitor.SampleWorker` dogfoods the Monitor-native SDK.",
              "- `Monitor.SampleWorker` dogfoods both Monitor-native telemetry and component command polling/execution."
          )
          replace_once(
              "README.md",
              "- GitHub Actions SQL Server-backed integration tests for telemetry, traces, logs, migration upgrades, keyset pagination, credentials, failure grouping, alert evaluation, signed webhook delivery, retry/dead-letter behavior, retention safety, and audit atomicity/secret exclusion.",
              "- GitHub Actions SQL Server-backed integration tests for telemetry, traces, logs, migration upgrades, keyset pagination, credentials, failure grouping, alert evaluation, signed webhook delivery, budgets, leased component commands, retention safety, and audit atomicity/secret exclusion."
          )
          replace_once(
              "README.md",
              "`MonitorRun.MeasureSpanAsync` records span duration and failure state. If recording failed telemetry itself fails, the SDK preserves the original application exception rather than replacing it with the telemetry error.",
              "`MonitorRun.MeasureSpanAsync` records span duration and failure state. If recording failed telemetry itself fails, the SDK preserves the original application exception rather than replacing it with the telemetry error.\n\nControl polling is separate from telemetry lifecycle calls:\n\n```csharp\nvar control = new MonitorControlClient(httpClient, componentKey);\nvar command = await control.ClaimNextAsync(component.Id, cancellationToken);\nif (command is not null)\n{\n    // Execute idempotently by command.Id in the workload/runtime.\n    await control.SucceedAsync(command, new { applied = true }, cancellationToken);\n}\n```\n\nCommand delivery is at-least-once: the stable command id is the idempotency key and each lease attempt receives a fresh lease token. See `docs/component-control-commands.md`."
          )
          replace_once(
              "README.md",
              "Monitor.Domain/          protocol-independent monitoring + log/failure/alert/audit model",
              "Monitor.Domain/          protocol-independent monitoring + log/failure/alert/budget/command/audit model"
          )
          replace_once(
              "README.md",
              "Monitor.Infrastructure/  EF Core persistence, retention, auditing, grouping/alerting/correlation + Identity store",
              "Monitor.Infrastructure/  EF Core persistence, retention, auditing, command leasing, grouping/alerting/correlation + Identity store"
          )
          replace_once(
              "README.md",
              "  component-ingestion-credentials.md\n  logs-and-run-events.md",
              "  component-ingestion-credentials.md\n  component-control-commands.md\n  budgets-and-usage-policy.md\n  logs-and-run-events.md"
          )
          replace_once(
              "README.md",
              "The maintained implementation sequence is in `docs/roadmap.md`. Alert-rule management, component credentials, logs/run events, and the durable audit trail are complete. The next planned slice is **budgets and usage policy**, followed by component control commands.",
              "The maintained implementation sequence is in `docs/roadmap.md`. Alert-rule management, component credentials, logs/run events, audit, budgets, and durable component control commands are complete. The next planned slice is **saved views**, followed by the richer live experience."
          )

          replace_once(
              "docs/architecture.md",
              "Current operator coverage includes alert acknowledgement, alert-rule create/update/enable/disable/delete, webhook destination create/enable/disable/test, alert-delivery requeue, and component credential issue/rotate/revoke. The writer also supports system actors so future automated control-plane mutations and commands can use the same audit model; existing autonomous telemetry processing is not duplicated into audit merely because it is system-executed.",
              "Current operator coverage includes alert acknowledgement, alert-rule create/update/enable/disable/delete, webhook destination create/enable/disable/test, alert-delivery requeue, component credential issue/rotate/revoke, budget operations, and component-command issue/cancel. Component command acknowledgements use `Component` actors and expiry uses a `System` actor; existing autonomous telemetry processing is not duplicated into audit merely because it is system-executed."
          )
          replace_once(
              "docs/architecture.md",
              "## Control plane\n\nCommands are intentionally absent from the current foundation. Observability and detection must be trustworthy before Monitor is allowed to alter remote workloads. Future commands should be durable auditable entities with requested/accepted/completed states rather than fire-and-forget HTTP actions, and operator/system command-state changes should emit `AuditEvent` records through the same audit contract.",
              "## Control plane\n\nComponent commands are durable operational records rather than fire-and-forget actions. Operators issue commands from component context; components claim them through a component-scoped authenticated endpoint, execute them in their own runtime, and explicitly report `Succeeded`, `Failed`, or `Rejected`.\n\nA claim changes `Pending` to `Leased` and assigns a fresh lease token. The command id remains stable across redelivery and is the workload's idempotency key. If a lease expires before acknowledgement, the same command becomes claimable again with a new token. Claim, completion, cancellation, and expiry all serialize on the same per-component SQL Server application lock, so competing Monitor nodes cannot terminalize a command inconsistently.\n\n`ComponentControlState` (`Active`, `Paused`, `Disabled`) is intentionally separate from the registry `Enabled`/credential-admission flag. Pause/Disable prevent new runs while allowing heartbeat, existing-run telemetry, and command polling. Server-side run creation enforces this state and returns HTTP 409 when new work is blocked.\n\n`KillRun` stores its target run id as forensic data rather than a foreign key so successful-run retention cannot erase or prevent command history. Restart remains runtime/host-specific; a component must map it to an actual supervisor rather than Monitor claiming generic remote-process control.\n\nOperator issue/cancel, component acknowledgement, and system expiry all emit durable `AuditEvent` records. Command payload JSON is excluded from immutable audit snapshots. The full protocol is documented in `docs/component-control-commands.md`."
          )
      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture.md src/Monitor.Web/Pages/ComponentDetail.cshtml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: synchronize component command contract"
          git push origin HEAD:feature/component-control-commands
