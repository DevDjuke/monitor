name: p7-readme-sync
on:
  push:
    branches: [feature/saved-views]
    paths: [.github/workflows/p7-readme-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saved-views
          fetch-depth: 0
      - name: Synchronize README for saved views
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')

          anchor = '- Server-side run admission enforcement for Paused/Disabled workload control state.'
          addition = anchor + '\n- Personal saved operational views across Runs, Logs, Usage, Alerts, Budgets, Audit, and Commands.\n- Canonical per-user filter presets with up to six pinned sidebar fast links; Runs filter state is bookmarkable while keyset cursors remain transient.'
          if anchor not in text:
              raise SystemExit('Current-slice saved-view anchor not found')
          text = text.replace(anchor, addition, 1)

          old_ci = '- GitHub Actions SQL Server-backed integration tests for telemetry, traces, logs, migration upgrades, keyset pagination, credentials, failure grouping, alert evaluation, signed webhook delivery, budgets, leased component commands, retention safety, and audit atomicity/secret exclusion.'
          new_ci = '- GitHub Actions SQL Server-backed integration tests for telemetry, traces, logs, migration upgrades, keyset pagination, credentials, failure grouping, alert evaluation, signed webhook delivery, budgets, leased component commands, personal saved-view ownership/canonicalization, retention safety, and audit atomicity/secret exclusion.'
          if old_ci not in text:
              raise SystemExit('CI summary anchor not found')
          text = text.replace(old_ci, new_ci, 1)

          docs_anchor = '  component-control-commands.md\n'
          if docs_anchor in text and '  saved-views.md\n' not in text:
              text = text.replace(docs_anchor, docs_anchor + '  saved-views.md\n', 1)

          pattern = r'The maintained implementation sequence is in `docs/roadmap\.md`\.[^\n]*'
          replacement = 'The maintained implementation sequence is in `docs/roadmap.md`. Saved views are now complete alongside the core observability, policy, audit, credential, and command-control slices. We intentionally reevaluate the next product priority before starting the richer live-experience work.'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('README roadmap summary not found')

          p.write_text(text, encoding='utf-8')
      - name: Commit README sync and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p7-readme-sync.yml
          git add README.md
          git commit -m "docs: add personal saved views to README"
          git push origin HEAD:feature/saved-views
