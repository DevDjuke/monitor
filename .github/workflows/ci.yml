name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore
      - name: Generate SQL Server migration
        if: ${{ github.event_name == 'pull_request' && hashFiles('src/Monitor.Infrastructure/Migrations/*InitialSqlServer.cs') == '' }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations add InitialSqlServer \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext \
            --output-dir Migrations
      - name: Commit generated SQL Server migration
        if: ${{ github.event_name == 'pull_request' && hashFiles('src/Monitor.Infrastructure/Migrations/*InitialSqlServer.cs') != '' }}
        run: |
          if git diff --quiet -- src/Monitor.Infrastructure/Migrations && [ -z "$(git status --porcelain src/Monitor.Infrastructure/Migrations)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Monitor.Infrastructure/Migrations
          git commit -m "Add SQL Server migration baseline"
          git push origin HEAD:${{ github.head_ref }}
