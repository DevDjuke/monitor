name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: MonitorCi!2026Password
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MonitorCi!2026Password' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - name: Generate run sequence migration
        if: ${{ github.event_name == 'pull_request' && hashFiles('src/Monitor.Infrastructure/Migrations/*AddRunSequence.cs') == '' }}
        run: |
          git show origin/main:src/Monitor.Infrastructure/Migrations/MonitorDbContextModelSnapshot.cs \
            > src/Monitor.Infrastructure/Migrations/MonitorDbContextModelSnapshot.cs
          rm -f src/Monitor.Infrastructure/Migrations/*AddRunSequence*.cs

          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations add AddRunSequence \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext \
            --output-dir Migrations
      - name: Commit generated migration
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git diff --quiet -- src/Monitor.Infrastructure/Migrations && [ -z "$(git status --porcelain src/Monitor.Infrastructure/Migrations)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Monitor.Infrastructure/Migrations
          git commit -m "Add run keyset sequence migration"
          git push origin HEAD:${{ github.head_ref }}
      - run: dotnet build Monitor.sln --configuration Release --no-restore
      - name: Smoke test authentication, SQL Server, and sample telemetry
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=Monitor;User Id=sa;Password=MonitorCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-test-ingestion-key
        run: |
          set -euo pipefail

          dotnet run \
            --project src/Monitor.Web \
            --configuration Release \
            --no-build \
            > /tmp/monitor-ci.log 2>&1 &
          app_pid=$!
          worker_pid=""

          cleanup() {
            if [ -n "$worker_pid" ]; then
              kill "$worker_pid" 2>/dev/null || true
              wait "$worker_pid" 2>/dev/null || true
            fi
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          app_ready=false
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:5080/api/health > /dev/null; then
              app_ready=true
              break
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ "$app_ready" != true ]; then
            echo "Monitor did not become ready."
            cat /tmp/monitor-ci.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:5080/account/login > /dev/null
          curl -fsS http://127.0.0.1:5080/account/setup > /dev/null
          curl -fsS http://127.0.0.1:5080/lib/microsoft/signalr/dist/browser/signalr.min.js > /dev/null

          unauthenticated_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/api/components)
          test "$unauthenticated_status" = "401"

          curl -fsS \
            -H 'X-Monitor-Key: ci-test-ingestion-key' \
            http://127.0.0.1:5080/api/components \
            > /dev/null

          Monitor__BaseUrl=http://127.0.0.1:5080 \
          Monitor__IngestionApiKey=ci-test-ingestion-key \
          SampleWorker__HeartbeatIntervalSeconds=1 \
          SampleWorker__RunIntervalSeconds=1 \
          SampleWorker__FailureEvery=2 \
          dotnet run \
            --project samples/Monitor.SampleWorker \
            --configuration Release \
            --no-build \
            > /tmp/monitor-worker-ci.log 2>&1 &
          worker_pid=$!

          telemetry_ready=false
          for attempt in {1..30}; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/monitor-worker-ci.log
              exit 1
            fi

            components=$(curl -fsS -H 'X-Monitor-Key: ci-test-ingestion-key' http://127.0.0.1:5080/api/components)
            runs=$(curl -fsS -H 'X-Monitor-Key: ci-test-ingestion-key' 'http://127.0.0.1:5080/api/runs?take=20')

            if echo "$components" | grep -q 'sample-website-auditor' \
              && echo "$runs" | grep -q 'Synthetic website audit' \
              && echo "$runs" | grep -q '"status":"Failed"'; then
              telemetry_ready=true
              break
            fi

            sleep 1
          done

          if [ "$telemetry_ready" != true ]; then
            echo "Sample telemetry did not reach Monitor."
            cat /tmp/monitor-worker-ci.log
            echo "Components: $components"
            echo "Runs: $runs"
            exit 1
          fi

          filtered=$(curl -fsS \
            -H 'X-Monitor-Key: ci-test-ingestion-key' \
            'http://127.0.0.1:5080/api/runs/query?pageSize=25&status=Failed&environment=development&search=Synthetic')
          echo "$filtered" | grep -q 'Synthetic website audit'
          echo "$filtered" | grep -q '"status":"Failed"'

          first_page=$(curl -fsS \
            -H 'X-Monitor-Key: ci-test-ingestion-key' \
            'http://127.0.0.1:5080/api/runs/query?pageSize=1')
          next_cursor=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("nextCursor") or "")' <<< "$first_page")
          test -n "$next_cursor"

          second_page=$(curl -fsS \
            -H 'X-Monitor-Key: ci-test-ingestion-key' \
            "http://127.0.0.1:5080/api/runs/query?pageSize=1&before=$next_cursor")
          first_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["items"][0]["id"])' <<< "$first_page")
          second_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["items"][0]["id"])' <<< "$second_page")
          test "$first_id" != "$second_id"
