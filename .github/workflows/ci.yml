name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: MonitorCi!2026Password
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MonitorCi!2026Password' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore
      - name: Smoke test authentication, migration upgrade, and realtime run queries
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=Monitor;User Id=sa;Password=MonitorCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-test-ingestion-key
        run: |
          set -euo pipefail

          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef database update 20260809200032_InitialSqlServer \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext \
            --connection "$ConnectionStrings__Monitor"

          sql_container=$(docker ps \
            --filter 'ancestor=mcr.microsoft.com/mssql/server:2022-latest' \
            --format '{{.ID}}' | head -n 1)
          test -n "$sql_container"

          docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCi!2026Password' -C -b -d Monitor \
            -Q "
              DECLARE @ComponentId uniqueidentifier = NEWID();
              INSERT INTO Components
                  (Id, Name, Slug, Type, Environment, Version, Enabled, Status, LastHeartbeatAt, LastRunAt, CreatedAt, UpdatedAt)
              VALUES
                  (@ComponentId, N'Legacy CI', N'legacy-ci', 0, N'development', N'0.0.1', 1, 1, NULL, NULL, SYSDATETIMEOFFSET(), SYSDATETIMEOFFSET());

              INSERT INTO Runs
                  (Id, ComponentId, ExternalId, Name, [Trigger], Model, Status, StartedAt, CompletedAt, InputTokens, OutputTokens, CostUsd, InputJson, OutputJson, Error)
              VALUES
                  (NEWID(), @ComponentId, N'legacy-1', N'Legacy run 1', N'CI', N'ci-model', 1, DATEADD(second, -2, SYSDATETIMEOFFSET()), SYSDATETIMEOFFSET(), 1, 1, 0.0, NULL, NULL, NULL),
                  (NEWID(), @ComponentId, N'legacy-2', N'Legacy run 2', N'CI', N'ci-model', 2, DATEADD(second, -1, SYSDATETIMEOFFSET()), SYSDATETIMEOFFSET(), 1, 0, 0.0, NULL, NULL, N'legacy failure');
            "

          dotnet ef database update \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext \
            --connection "$ConnectionStrings__Monitor"

          (
            cd src/Monitor.Web
            exec dotnet bin/Release/net10.0/Monitor.Web.dll
          ) > /tmp/monitor-ci.log 2>&1 &
          app_pid=$!
          worker_pid=""

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "=== Monitor log after failed smoke gate ==="
              cat /tmp/monitor-ci.log 2>/dev/null || true
              echo "=== End Monitor log ==="
            fi
            if [ -n "$worker_pid" ]; then
              kill "$worker_pid" 2>/dev/null || true
              wait "$worker_pid" 2>/dev/null || true
            fi
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            return "$status"
          }
          trap cleanup EXIT

          app_ready=false
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:5080/api/health > /dev/null; then
              app_ready=true
              break
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Monitor process exited during startup."
              wait "$app_pid" || true
              cat /tmp/monitor-ci.log
              exit 1
            fi

            sleep 1
          done

          if [ "$app_ready" != true ]; then
            echo "Monitor did not become ready within the startup window."
            cat /tmp/monitor-ci.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:5080/account/login > /dev/null
          curl -fsS http://127.0.0.1:5080/account/setup > /dev/null
          curl -fsS http://127.0.0.1:5080/lib/microsoft/signalr/dist/browser/signalr.min.js > /dev/null

          unauthenticated_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/api/components)
          test "$unauthenticated_status" = "401"

          unauthenticated_hub_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST 'http://127.0.0.1:5080/hubs/monitor/negotiate?negotiateVersion=1')
          test "$unauthenticated_hub_status" = "401"

          legacy_runs=$(curl -fsS \
            -H 'X-Monitor-Key: ci-test-ingestion-key' \
            'http://127.0.0.1:5080/api/runs/query?pageSize=25&search=Legacy')
          python3 -c '
          import json, sys
          data = json.load(sys.stdin)["items"]
          assert len(data) == 2, data
          sequences = [row["sequence"] for row in data]
          assert all(value > 0 for value in sequences), sequences
          assert len(set(sequences)) == 2, sequences
          ' <<< "$legacy_runs"

          (
            cd samples/Monitor.SampleWorker
            Monitor__BaseUrl=http://127.0.0.1:5080 \
            Monitor__IngestionApiKey=ci-test-ingestion-key \
            SampleWorker__HeartbeatIntervalSeconds=1 \
            SampleWorker__RunIntervalSeconds=1 \
            SampleWorker__FailureEvery=2 \
            exec dotnet bin/Release/net10.0/Monitor.SampleWorker.dll
          ) > /tmp/monitor-worker-ci.log 2>&1 &
          worker_pid=$!

          telemetry_ready=false
          for attempt in {1..30}; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/monitor-worker-ci.log
              exit 1
            fi

            components=$(curl -fsS -H 'X-Monitor-Key: ci-test-ingestion-key' http://127.0.0.1:5080/api/components)
            filtered=$(curl -fsS \
              -H 'X-Monitor-Key: ci-test-ingestion-key' \
              'http://127.0.0.1:5080/api/runs/query?pageSize=25&status=Failed&environment=development&search=Synthetic')

            if echo "$components" | grep -q 'sample-website-auditor' \
              && python3 -c '
          import json, sys
          items = json.load(sys.stdin)["items"]
          raise SystemExit(0 if any(item["name"] == "Synthetic website audit" and item["status"] == "Failed" for item in items) else 1)
          ' <<< "$filtered"; then
              telemetry_ready=true
              break
            fi

            sleep 1
          done

          if [ "$telemetry_ready" != true ]; then
            echo "Failed sample telemetry did not reach Monitor."
            cat /tmp/monitor-worker-ci.log
            echo "Components: $components"
            echo "Filtered failed runs: $filtered"
            exit 1
          fi

          python3 -c '
          import json, sys
          items = json.load(sys.stdin)["items"]
          assert any(item["name"] == "Synthetic website audit" and item["status"] == "Failed" for item in items), items
          ' <<< "$filtered"

          options=$(curl -fsS \
            -H 'X-Monitor-Key: ci-test-ingestion-key' \
            'http://127.0.0.1:5080/api/runs/options')
          echo "$options" | grep -q 'Sample Website Auditor'
          echo "$options" | grep -q 'sample-model'

          component_id=$(python3 -c '
          import json, sys
          components = json.load(sys.stdin)
          print(next(item["id"] for item in components if item["slug"] == "sample-website-auditor"))
          ' <<< "$components")

          for i in {1..30}; do
            curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              -H 'X-Monitor-Key: ci-test-ingestion-key' \
              http://127.0.0.1:5080/api/runs \
              -d "{\"componentId\":\"$component_id\",\"name\":\"Keyset smoke $i\",\"externalId\":\"keyset-$i\",\"trigger\":\"CI\",\"model\":\"ci-model\",\"inputJson\":null}" \
              > /dev/null
          done

          first_page=$(curl -fsS \
            -H 'X-Monitor-Key: ci-test-ingestion-key' \
            'http://127.0.0.1:5080/api/runs/query?pageSize=25')
          next_cursor=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("nextCursor") or "")' <<< "$first_page")
          test -n "$next_cursor"

          second_page=$(curl -fsS \
            -H 'X-Monitor-Key: ci-test-ingestion-key' \
            "http://127.0.0.1:5080/api/runs/query?pageSize=25&before=$next_cursor")
          python3 -c '
          import json, sys
          first = json.loads(sys.argv[1])["items"]
          second = json.loads(sys.argv[2])["items"]
          assert len(first) == 25, len(first)
          assert len(second) > 0, second
          first_ids = {row["id"] for row in first}
          second_ids = {row["id"] for row in second}
          assert first_ids.isdisjoint(second_ids), (first_ids & second_ids)
          assert max(row["sequence"] for row in second) < min(row["sequence"] for row in first), (first, second)
          ' "$first_page" "$second_page"

      - name: Smoke test retention aggregation and forensic preservation
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5081
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=Monitor;User Id=sa;Password=MonitorCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-test-ingestion-key
          Monitor__BootstrapAdmin__Email: ci@monitor.local
          Monitor__BootstrapAdmin__Password: MonitorCiAdmin2026
          Retention__Enabled: true
          Retention__AggregationDelayMinutes: 0
          Retention__SuccessfulRunDetailDays: 1
          Retention__SweepIntervalMinutes: 1
          Retention__BatchSize: 100
          Retention__MaxBatchesPerSweep: 5
        run: |
          set -euo pipefail

          sql_container=$(docker ps \
            --filter 'ancestor=mcr.microsoft.com/mssql/server:2022-latest' \
            --format '{{.ID}}' | head -n 1)
          test -n "$sql_container"

          docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorCi!2026Password' -C -b -d Monitor \
            -Q "
              DECLARE @ComponentId uniqueidentifier = (SELECT TOP(1) Id FROM Components WHERE Slug = N'legacy-ci');
              DECLARE @SuccessId uniqueidentifier = NEWID();
              DECLARE @FailedId uniqueidentifier = NEWID();
              DECLARE @CancelledId uniqueidentifier = NEWID();
              DECLARE @StartedAt datetimeoffset = DATEADD(day, -2, SYSDATETIMEOFFSET());
              DECLARE @CompletedAt datetimeoffset = DATEADD(second, 2, @StartedAt);

              INSERT INTO Runs
                  (Id, ComponentId, ExternalId, Name, [Trigger], Model, Status, StartedAt, CompletedAt, AggregatedAt, InputTokens, OutputTokens, CostUsd, InputJson, OutputJson, Error)
              VALUES
                  (@SuccessId, @ComponentId, N'retention-success', N'Retention success', N'CI', N'retention-model', 1, @StartedAt, @CompletedAt, NULL, 10, 20, 0.10, N'{}', N'{}', NULL),
                  (@FailedId, @ComponentId, N'retention-failed', N'Retention failed', N'CI', N'retention-model', 2, @StartedAt, @CompletedAt, NULL, 11, 21, 0.20, N'{}', N'{}', N'retention failure'),
                  (@CancelledId, @ComponentId, N'retention-cancelled', N'Retention cancelled', N'CI', N'retention-model', 3, @StartedAt, @CompletedAt, NULL, 12, 22, 0.30, N'{}', N'{}', N'retention cancelled');

              INSERT INTO Spans
                  (Id, RunId, ParentSpanId, Name, Kind, Status, StartedAt, CompletedAt, AttributesJson, Error)
              VALUES
                  (NEWID(), @SuccessId, NULL, N'Retention success span', 4, 1, @StartedAt, @CompletedAt, N'{}', NULL),
                  (NEWID(), @FailedId, NULL, N'Retention failed span', 4, 2, @StartedAt, @CompletedAt, N'{}', N'failed span detail'),
                  (NEWID(), @CancelledId, NULL, N'Retention cancelled span', 4, 2, @StartedAt, @CompletedAt, N'{}', N'cancelled span detail');
            "

          (
            cd src/Monitor.Web
            exec dotnet bin/Release/net10.0/Monitor.Web.dll
          ) > /tmp/monitor-retention-ci.log 2>&1 &
          app_pid=$!

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "=== Monitor retention log ==="
              cat /tmp/monitor-retention-ci.log 2>/dev/null || true
              echo "=== End Monitor retention log ==="
            fi
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            return "$status"
          }
          trap cleanup EXIT

          app_ready=false
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:5081/api/health > /dev/null; then
              app_ready=true
              break
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Monitor process exited during retention startup."
              wait "$app_pid" || true
              exit 1
            fi

            sleep 1
          done
          test "$app_ready" = true

          retention_ready=false
          for attempt in {1..30}; do
            state=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'MonitorCi!2026Password' -C -b -d Monitor -h -1 -W \
              -Q "
                SET NOCOUNT ON;
                DECLARE @ComponentId uniqueidentifier = (SELECT TOP(1) Id FROM Components WHERE Slug = N'legacy-ci');
                SELECT CONCAT(
                  (SELECT COUNT(*) FROM Runs WHERE ExternalId = N'retention-success'), N'|',
                  (SELECT COUNT(*) FROM Runs WHERE ExternalId = N'retention-failed' AND AggregatedAt IS NOT NULL AND Error = N'retention failure' AND InputJson = N'{}' AND OutputJson = N'{}'), N'|',
                  (SELECT COUNT(*) FROM Runs WHERE ExternalId = N'retention-cancelled' AND AggregatedAt IS NOT NULL AND Error = N'retention cancelled' AND InputJson = N'{}' AND OutputJson = N'{}'), N'|',
                  (SELECT COUNT(*) FROM Spans s INNER JOIN Runs r ON r.Id = s.RunId WHERE r.ExternalId IN (N'retention-failed', N'retention-cancelled')), N'|',
                  (SELECT COUNT(*) FROM Spans WHERE Name = N'Retention success span'), N'|',
                  (SELECT COALESCE(SUM(TotalRuns), 0) FROM RunAggregates WHERE ComponentId = @ComponentId AND Model = N'retention-model'), N'|',
                  (SELECT COALESCE(SUM(SuccessRuns), 0) FROM RunAggregates WHERE ComponentId = @ComponentId AND Model = N'retention-model'), N'|',
                  (SELECT COALESCE(SUM(FailedRuns), 0) FROM RunAggregates WHERE ComponentId = @ComponentId AND Model = N'retention-model'), N'|',
                  (SELECT COALESCE(SUM(CancelledRuns), 0) FROM RunAggregates WHERE ComponentId = @ComponentId AND Model = N'retention-model')
                );
              " | tr -d '\r' | xargs)

            if [ "$state" = "0|1|1|2|0|3|1|1|1" ]; then
              retention_ready=true
              break
            fi

            sleep 1
          done

          if [ "$retention_ready" != true ]; then
            echo "Retention invariant state was: $state"
            exit 1
          fi

          curl -fsS -c /tmp/monitor-retention-cookies.txt \
            http://127.0.0.1:5081/account/login \
            -o /tmp/monitor-retention-login.html

          token=$(python3 -c '
          import re
          html = open("/tmp/monitor-retention-login.html", encoding="utf-8").read()
          match = re.search(r"name=\"__RequestVerificationToken\"[^>]*value=\"([^\"]+)\"", html)
          assert match, "antiforgery token not found"
          print(match.group(1))
          ')

          login_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -b /tmp/monitor-retention-cookies.txt \
            -c /tmp/monitor-retention-cookies.txt \
            --data-urlencode "__RequestVerificationToken=$token" \
            --data-urlencode 'Input.Email=ci@monitor.local' \
            --data-urlencode 'Input.Password=MonitorCiAdmin2026' \
            --data-urlencode 'Input.RememberMe=false' \
            http://127.0.0.1:5081/account/login)
          test "$login_status" = "302"

          curl -fsS -b /tmp/monitor-retention-cookies.txt \
            http://127.0.0.1:5081/usage \
            -o /tmp/monitor-retention-usage.html
          grep -q 'RETENTION / AGGREGATION' /tmp/monitor-retention-usage.html
          grep -q 'Failed and cancelled runs are never purged' /tmp/monitor-retention-usage.html
