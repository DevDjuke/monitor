name: p14-refresh-legacy-otlp-gates

on:
  push:
    branches: [feature/otlp-compatibility]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/otlp-compatibility
      - run: python3 .github/scripts/p14-refresh-legacy-gates.py
      - name: Commit refreshed gates
        run: |
          if [ "$(cat /tmp/p14-changed)" != "1" ]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/otlp-ci.yml .github/workflows/logs-ci.yml .github/scripts/otlp-metrics-ci.sh
          git commit -m "P14 refresh legacy OTLP media-type gates"
          git push origin HEAD:feature/otlp-compatibility
