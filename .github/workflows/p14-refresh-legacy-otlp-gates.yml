name: p14-refresh-legacy-otlp-gates

on:
  push:
    branches: [feature/otlp-compatibility]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/otlp-compatibility
      - run: python3 .github/scripts/p14-refresh-legacy-gates.py
      - name: Publish patched blobs at temporary non-workflow paths
        run: |
          mkdir -p .github/p14-temp
          cp .github/workflows/otlp-ci.yml .github/p14-temp/otlp-ci.yml.patched
          cp .github/workflows/logs-ci.yml .github/p14-temp/logs-ci.yml.patched
          cp .github/scripts/otlp-metrics-ci.sh .github/p14-temp/otlp-metrics-ci.sh.patched
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/p14-temp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "P14 stage refreshed legacy gate blobs"
          git push origin HEAD:feature/otlp-compatibility
