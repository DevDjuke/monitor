name: p13-finalize-schema

on:
  push:
    branches: [feature/otlp-metrics]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/otlp-metrics
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Preserve OTLP Summary cumulative semantics
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/Monitor.Web/Otlp/OtlpMetricImporter.cs')
          s = p.read_text()
          old_count = s.count('MetricAggregationTemporality.Unspecified')
          s = s.replace(
              'componentId, metric.Name, MetricKind.Summary, MetricAggregationTemporality.Unspecified,',
              'componentId, metric.Name, MetricKind.Summary, MetricAggregationTemporality.Cumulative,')
          s = s.replace(
              'componentId, metric.Name, metric.Description, metric.Unit, MetricKind.Summary,\n                MetricAggregationTemporality.Unspecified, false, hasRecordedValue,',
              'componentId, metric.Name, metric.Description, metric.Unit, MetricKind.Summary,\n                MetricAggregationTemporality.Cumulative, false, hasRecordedValue,')
          if 'MetricKind.Summary, MetricAggregationTemporality.Cumulative' not in s:
              raise SystemExit('Summary dedupe temporality patch did not apply')
          if 'MetricKind.Summary,\n                MetricAggregationTemporality.Cumulative, false' not in s:
              raise SystemExit('Summary persistence temporality patch did not apply')
          p.write_text(s)
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore
      - name: Commit semantic correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Monitor.Web/Otlp/OtlpMetricImporter.cs
          git commit -m 'P13 preserve cumulative Summary semantics'
          git push origin HEAD:feature/otlp-metrics
