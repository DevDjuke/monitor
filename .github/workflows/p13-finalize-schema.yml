name: p13-finalize-schema

on:
  push:
    branches: [feature/otlp-metrics]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/otlp-metrics
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore the real main snapshot and remove only bad P13 migration files
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          migrations = Path('src/Monitor.Infrastructure/Migrations')
          for path in migrations.glob('*_OtlpMetrics*.cs'):
              path.unlink()

          baseline = subprocess.check_output(
              ['git','show','origin/main:src/Monitor.Infrastructure/Migrations/MonitorDbContextModelSnapshot.cs'],
              text=True)
          (migrations / 'MonitorDbContextModelSnapshot.cs').write_text(baseline)
      - run: dotnet restore Monitor.sln
      - name: Verify current P13 model compiles before schema generation
        run: dotnet build Monitor.sln --configuration Release --no-restore
      - name: Generate P13 as a diff from main's actual model snapshot
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations add OtlpMetrics \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext \
            --output-dir Migrations
      - name: Refuse any migration that touches pre-P13 schema
        shell: bash
        run: |
          set -euo pipefail
          migration=$(ls src/Monitor.Infrastructure/Migrations/*_OtlpMetrics.cs | grep -v Designer | tail -n 1)
          test -n "$migration"
          test "$(grep -c 'migrationBuilder.CreateTable' "$migration")" = "1"
          grep -q 'name: "MetricPoints"' "$migration"
          grep -q 'type: "decimal(20,0)"' "$migration"
          grep -q 'migrationBuilder.DropTable' "$migration"
          grep -q 'name: "MetricPoints"' "$migration"
          ! grep -q 'CreateSequence' "$migration"
          ! grep -q 'AlertDeliveryDestinations' "$migration"
          ! grep -q 'AspNetUsers' "$migration"
          ! grep -q 'RunAggregates' "$migration"
          ! grep -q 'UsageBudgets' "$migration"
      - name: Commit clean P13 migration and snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Monitor.Infrastructure/Migrations
          git commit -m 'P13 regenerate metrics migration from main snapshot'
          git push origin HEAD:feature/otlp-metrics
