name: policy-actions-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  policy-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: MonitorPolicyActionCi!2026Password
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MonitorPolicyActionCi!2026Password' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore
      - name: Exercise opt-in budget enforcement through durable component commands
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5098
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=MonitorPolicyActionCi;User Id=sa;Password=MonitorPolicyActionCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-policy-action-key
          Monitor__BootstrapAdmin__Email: policy-ci@monitor.local
          Monitor__BootstrapAdmin__Password: MonitorPolicyAdmin2026
          Retention__Enabled: false
          FailureAlerting__Enabled: false
          UsageBudgets__Enabled: true
          UsageBudgets__InitialDelaySeconds: 0
          UsageBudgets__SweepIntervalSeconds: 2
          AlertDelivery__Enabled: false
          ComponentCommands__Enabled: true
          ComponentCommands__LeaseSeconds: 10
          ComponentCommands__SweepIntervalSeconds: 2
          ComponentCommands__DefaultExpiryMinutes: 10
          ComponentCommands__MaxDeliveryAttempts: 3
        run: bash .github/scripts/policy-actions-ci.sh
