name: logs-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  logs:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: MonitorLogsCi!2026Password
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MonitorLogsCi!2026Password' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore

      - name: Exercise native and OTLP structured logs
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5086
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=MonitorLogsCi;User Id=sa;Password=MonitorLogsCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-logs-ingestion-key
          Monitor__BootstrapAdmin__Email: logs-ci@monitor.local
          Monitor__BootstrapAdmin__Password: MonitorLogsAdmin2026
          Retention__Enabled: false
          FailureAlerting__Enabled: false
          AlertDelivery__Enabled: false
        run: |
          set -euo pipefail

          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef database update \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext \
            --connection "$ConnectionStrings__Monitor"

          sql_container=$(docker ps \
            --filter 'ancestor=mcr.microsoft.com/mssql/server:2022-latest' \
            --format '{{.ID}}' | head -n 1)
          test -n "$sql_container"

          (
            cd src/Monitor.Web
            exec dotnet bin/Release/net10.0/Monitor.Web.dll
          ) > /tmp/monitor-logs-ci.log 2>&1 &
          app_pid=$!

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "=== Monitor logs integration output ==="
              cat /tmp/monitor-logs-ci.log 2>/dev/null || true
              echo "=== End diagnostic output ==="
            fi
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            return "$status"
          }
          trap cleanup EXIT

          app_ready=false
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:5086/api/health > /dev/null; then
              app_ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Monitor exited while starting."
              wait "$app_pid" || true
              exit 1
            fi
            sleep 1
          done
          test "$app_ready" = true

          unauth_logs=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/x-protobuf' --data-binary '' \
            http://127.0.0.1:5086/v1/logs)
          test "$unauth_logs" = "401"

          unsupported_logs=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H 'X-Monitor-Key: ci-logs-ingestion-key' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://127.0.0.1:5086/v1/logs)
          test "$unsupported_logs" = "415"

          native_component=$(curl -fsS \
            -X POST http://127.0.0.1:5086/api/components/register \
            -H 'Content-Type: application/json' \
            -H 'X-Monitor-Key: ci-logs-ingestion-key' \
            -d '{"name":"Native Log Worker","slug":"native-log-worker","type":"Service","environment":"development","version":"1.0.0"}')
          native_component_id=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["id"])' <<< "$native_component")

          native_run=$(curl -fsS \
            -X POST http://127.0.0.1:5086/api/runs \
            -H 'Content-Type: application/json' \
            -H 'X-Monitor-Key: ci-logs-ingestion-key' \
            -d "{\"componentId\":\"$native_component_id\",\"name\":\"Native structured log run\",\"trigger\":\"CI\"}")
          native_run_id=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["id"])' <<< "$native_run")

          native_event=$(curl -fsS \
            -X POST "http://127.0.0.1:5086/api/runs/$native_run_id/events" \
            -H 'Content-Type: application/json' \
            -H 'X-Monitor-Key: ci-logs-ingestion-key' \
            -d '{"level":"Warning","message":"Native queue depth warning","messageTemplate":"Native queue depth {Depth}","propertiesJson":"{\"Depth\":42,\"Queue\":\"invoices\"}","source":"CI.Native","eventName":"queue.depth.warning"}')
          native_event_id=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["id"])' <<< "$native_event")
          test -n "$native_event_id"

          curl -fsS \
            -X POST "http://127.0.0.1:5086/api/runs/$native_run_id/complete" \
            -H 'Content-Type: application/json' \
            -H 'X-Monitor-Key: ci-logs-ingestion-key' \
            -d '{"status":"Success","inputTokens":0,"outputTokens":0,"costUsd":0}' \
            > /dev/null

          native_query=$(curl -fsS \
            -H 'X-Monitor-Key: ci-logs-ingestion-key' \
            "http://127.0.0.1:5086/api/logs/query?runId=$native_run_id&level=Warning&search=queue")
          python3 - "$native_run_id" <<< "$native_query" <<'PY'
          import json, sys
          data = json.loads(sys.stdin.read())
          assert data["count"] == 1, data
          item = data["items"][0]
          assert item["runId"].lower() == sys.argv[1].lower(), item
          assert item["level"] == "Warning", item
          assert item["message"] == "Native queue depth warning", item
          assert item["messageTemplate"] == "Native queue depth {Depth}", item
          assert item["source"] == "CI.Native", item
          assert '"Depth":42' in item["propertiesJson"], item
          PY

          Monitor__BaseUrl=http://127.0.0.1:5086 \
          Monitor__IngestionApiKey=ci-logs-ingestion-key \
            dotnet samples/Monitor.OtlpSampleWorker/bin/Release/net10.0/Monitor.OtlpSampleWorker.dll

          logs_ready=false
          log_state=""
          for attempt in {1..30}; do
            log_state=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'MonitorLogsCi!2026Password' -C -b -d MonitorLogsCi -h -1 -W \
              -Q "
                SET NOCOUNT ON;
                DECLARE @OtlpComponent uniqueidentifier = (
                  SELECT TOP(1) Id FROM Components
                  WHERE Slug = N'monitor-samples-otlp-sample-auditor' AND Environment = N'development'
                );
                SELECT CONCAT(
                  (SELECT COUNT(*) FROM LogEvents WHERE Id = '$native_event_id' AND RunId = '$native_run_id' AND Level = 4 AND Source = N'CI.Native'), N'|',
                  (SELECT COUNT(*) FROM LogEvents WHERE ComponentId = @OtlpComponent), N'|',
                  (SELECT COUNT(*) FROM LogEvents WHERE ComponentId = @OtlpComponent AND Level >= 5), N'|',
                  (SELECT COUNT(*) FROM LogEvents WHERE ComponentId = @OtlpComponent AND RunId IS NOT NULL), N'|',
                  (SELECT COUNT(*) FROM LogEvents WHERE ComponentId = @OtlpComponent AND SpanId IS NOT NULL), N'|',
                  (SELECT COUNT(*) FROM LogEvents WHERE ComponentId = @OtlpComponent AND ExceptionType LIKE N'%InvalidOperationException%' AND ExceptionMessage LIKE N'Rate limit exceeded for request req-%'), N'|',
                  (SELECT COUNT(*) FROM LogEvents WHERE ComponentId = @OtlpComponent AND MessageTemplate LIKE N'Provider rate limit while handling request%'), N'|',
                  (SELECT COUNT(*) FROM LogEvents WHERE ComponentId = @OtlpComponent AND Source = N'Monitor.OtlpSampleWorker')
                );
              " | tr -d '\r' | xargs)

            IFS='|' read -r native_count total_logs error_logs correlated_runs correlated_spans exception_logs template_logs source_logs <<< "$log_state"
            if [ "$native_count" = "1" ] && \
               [ "${total_logs:-0}" -ge 9 ] && \
               [ "${error_logs:-0}" -ge 2 ] && \
               [ "${correlated_runs:-0}" -ge 9 ] && \
               [ "${correlated_spans:-0}" -ge 3 ] && \
               [ "${exception_logs:-0}" -ge 2 ] && \
               [ "${template_logs:-0}" -ge 2 ] && \
               [ "${source_logs:-0}" -ge 9 ]; then
              logs_ready=true
              break
            fi
            sleep 1
          done

          if [ "$logs_ready" != true ]; then
            echo "Log invariant state was: $log_state"
            exit 1
          fi

          failed_run_id=$(docker exec "$sql_container" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'MonitorLogsCi!2026Password' -C -b -d MonitorLogsCi -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT TOP(1) CONVERT(nvarchar(36), r.Id) FROM Runs r INNER JOIN Components c ON c.Id = r.ComponentId WHERE c.Slug = N'monitor-samples-otlp-sample-auditor' AND r.Status = 2 ORDER BY r.Sequence;" \
            | tr -d '\r' | xargs)
          test -n "$failed_run_id"

          curl -fsS -c /tmp/monitor-logs-cookies.txt \
            http://127.0.0.1:5086/account/login \
            -o /tmp/monitor-logs-login.html
          login_token=$(python3 -c '
          import re
          html = open("/tmp/monitor-logs-login.html", encoding="utf-8").read()
          match = re.search(r"name=\"__RequestVerificationToken\"[^>]*value=\"([^\"]+)\"", html)
          assert match, "login antiforgery token not found"
          print(match.group(1))
          ')
          login_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -b /tmp/monitor-logs-cookies.txt \
            -c /tmp/monitor-logs-cookies.txt \
            --data-urlencode "__RequestVerificationToken=$login_token" \
            --data-urlencode 'Input.Email=logs-ci@monitor.local' \
            --data-urlencode 'Input.Password=MonitorLogsAdmin2026' \
            --data-urlencode 'Input.RememberMe=false' \
            http://127.0.0.1:5086/account/login)
          test "$login_status" = "302"

          curl -fsS -b /tmp/monitor-logs-cookies.txt \
            'http://127.0.0.1:5086/logs?Window=24h&MinimumLevel=Error&Search=Provider' \
            -o /tmp/monitor-logs-page.html
          grep -q 'Provider rate limit while handling request' /tmp/monitor-logs-page.html
          grep -q 'System.InvalidOperationException' /tmp/monitor-logs-page.html
          grep -q 'Monitor.OtlpSampleWorker' /tmp/monitor-logs-page.html

          curl -fsS -b /tmp/monitor-logs-cookies.txt \
            "http://127.0.0.1:5086/run/$failed_run_id" \
            -o /tmp/monitor-run-timeline.html
          grep -q 'TIMELINE' /tmp/monitor-run-timeline.html
          grep -q 'Provider rate limit while handling request' /tmp/monitor-run-timeline.html
          grep -q 'Generate recommendation' /tmp/monitor-run-timeline.html
