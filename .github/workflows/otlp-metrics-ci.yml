name: otlp-metrics-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  otlp-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: MonitorMetricsCi!2026Password
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MonitorMetricsCi!2026Password' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore
      - run: dotnet build .github/fixtures/OtlpMetricsFixture/OtlpMetricsFixture.csproj --configuration Release --no-restore
      - name: Exercise OTLP metrics fidelity, authorization, dedupe, UI and retention
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5099
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=MonitorMetricsCi;User Id=sa;Password=MonitorMetricsCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-metrics-bootstrap-key
          Monitor__BootstrapAdmin__Email: metrics-ci@monitor.local
          Monitor__BootstrapAdmin__Password: MonitorMetricsAdmin2026
          Retention__Enabled: true
          Retention__MetricDetailDays: 1
          Retention__SweepIntervalMinutes: 1
          FailureAlerting__Enabled: false
          UsageBudgets__Enabled: false
          AlertDelivery__Enabled: false
          ComponentCommands__Enabled: false
        run: bash .github/scripts/otlp-metrics-ci.sh
