name: generate-otlp-failure-migration

on:
  push:
    branches: [feature/otlp-failure-groups]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/otlp-failure-groups
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - name: Generate EF migration
        run: |
          set -euo pipefail
          if compgen -G 'src/Monitor.Infrastructure/Migrations/*_OtlpAndFailureGroups.cs' > /dev/null; then
            echo 'OtlpAndFailureGroups migration already exists.'
            exit 0
          fi

          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations add OtlpAndFailureGroups \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Monitor.Infrastructure/Migrations
          git commit -m 'Add OTLP and failure grouping migration'
          git push origin HEAD:feature/otlp-failure-groups
