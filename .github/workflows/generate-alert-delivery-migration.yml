name: generate-alert-delivery-migration

on:
  push:
    branches:
      - feature/alert-delivery-outbox
    paths:
      - .github/workflows/generate-alert-delivery-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alert-delivery-outbox
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Monitor.sln

      - name: Generate EF Core migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations add AlertDeliveryOutbox \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext \
            --output-dir Migrations

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Monitor.Infrastructure/Migrations
          git diff --cached --quiet && exit 0
          git commit -m "Add alert delivery outbox migration"
          git push origin HEAD:feature/alert-delivery-outbox
