name: alert-delivery-adapters-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  alert-delivery-adapters:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: MonitorAdaptersCi!2026Password
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MonitorAdaptersCi!2026Password' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore
      - name: Exercise durable webhook, Slack, Teams, Discord, PagerDuty and email delivery
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5095
          BASE_URL: http://127.0.0.1:5095
          DB_NAME: MonitorAlertAdaptersCi
          SQL_PASSWORD: MonitorAdaptersCi!2026Password
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=MonitorAlertAdaptersCi;User Id=sa;Password=MonitorAdaptersCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-adapters-ingestion-key
          Monitor__BootstrapAdmin__Email: adapters-ci@monitor.local
          Monitor__BootstrapAdmin__Password: MonitorAdaptersAdmin2026
          Retention__Enabled: false
          FailureAlerting__Enabled: true
          FailureAlerting__InitialDelaySeconds: 0
          FailureAlerting__SweepIntervalSeconds: 1
          UsageBudgets__Enabled: false
          AlertDelivery__Enabled: true
          AlertDelivery__SweepIntervalSeconds: 1
          AlertDelivery__BaseRetrySeconds: 1
          AlertDelivery__RequestTimeoutSeconds: 5
          ComponentCommands__Enabled: false
        run: bash .github/scripts/alert-delivery-adapters-ci.sh
