name: p7-test-fix
on:
  push:
    branches: [feature/saved-views]
    paths: [.github/workflows/p7-test-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saved-views
          fetch-depth: 0
      - name: Make selected-view assertion HTML-semantic
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/saved-views-ci.yml')
          text = p.read_text(encoding='utf-8')
          old = '''          python3 - <<'PY'
          import re
          page = open('/tmp/saved-view-applied.html', encoding='utf-8').read()
          assert re.search(r'<option[^>]*selected[^>]*>★ Production failures</option>', page), 'saved view was not selected'
          PY
'''
          new = '''          python3 - <<'PY'
          import html
          import re
          page = html.unescape(open('/tmp/saved-view-applied.html', encoding='utf-8').read())
          match = re.search(r'<option(?=[^>]*\\bselected(?:=|\\s|>))[^>]*>[^<]*Production failures</option>', page)
          assert match, 'saved view was not selected'
          assert re.search(r'<strong>\\s*Applied\\s*</strong>', page), 'applied state was not rendered'
          PY
'''
          if old not in text:
              raise SystemExit('Expected saved-view assertion block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit test correction and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p7-test-fix.yml
          git add .github/workflows/saved-views-ci.yml
          git commit -m "test: parse applied saved view semantically"
          git push origin HEAD:feature/saved-views
