name: generate-retention-migration

on:
  push:
    branches: [feature/retention-aggregation]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/retention-aggregation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - name: Generate EF migration
        run: |
          set -euo pipefail
          if compgen -G 'src/Monitor.Infrastructure/Migrations/*_RetentionAggregation.cs' > /dev/null; then
            echo 'RetentionAggregation migration already exists.'
            exit 0
          fi

          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations add RetentionAggregation \
            --project src/Monitor.Infrastructure \
            --startup-project src/Monitor.Web \
            --context MonitorDbContext

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Monitor.Infrastructure/Migrations
          git commit -m 'Add retention aggregation migration'
          git push origin HEAD:feature/retention-aggregation
