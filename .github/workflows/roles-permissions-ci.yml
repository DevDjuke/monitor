name: roles-permissions-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  roles-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: MonitorRolesCi!2026Password
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MonitorRolesCi!2026Password' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Monitor.sln
      - run: dotnet build Monitor.sln --configuration Release --no-restore
      - name: Exercise role matrix, operator lifecycle, and server-side authorization
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5099
          ConnectionStrings__Monitor: Server=127.0.0.1,1433;Database=MonitorRolesCi;User Id=sa;Password=MonitorRolesCi!2026Password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
          Monitor__IngestionApiKey: ci-roles-bootstrap-key
          Monitor__BootstrapAdmin__Email: owner-ci@monitor.local
          Monitor__BootstrapAdmin__Password: MonitorOwner2026
          Retention__Enabled: false
          FailureAlerting__Enabled: false
          UsageBudgets__Enabled: false
          AlertDelivery__Enabled: false
          ComponentCommands__Enabled: true
          ComponentCommands__SweepIntervalSeconds: 2
        run: bash .github/scripts/roles-permissions-ci.sh
