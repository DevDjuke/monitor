name: monitor

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      monitor:
        condition: service_healthy
    environment:
      MONITOR_HOST: ${MONITOR_HOST:?Set MONITOR_HOST in .env}
    ports:
      - "${MONITOR_HTTP_PORT:-80}:80"
      - "${MONITOR_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      monitor_backend:
        ipv4_address: 172.31.250.10

  monitor:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:4317
      Kestrel__Endpoints__Grpc__Protocols: Http2
      AllowedHosts: "${MONITOR_HOST:?Set MONITOR_HOST in .env};localhost;127.0.0.1"
      Production__PublicUrl: https://${MONITOR_HOST:?Set MONITOR_HOST in .env}
      Production__MigrateOnStartup: ${MONITOR_MIGRATE_ON_STARTUP:-true}
      Production__UseHttpsRedirection: "false"
      Production__ForwardedHeaders__Enabled: "true"
      Production__ForwardedHeaders__KnownProxies__0: 172.31.250.10
      Monitor__BootstrapAdmin__Email: ${MONITOR_ADMIN_EMAIL:?Set MONITOR_ADMIN_EMAIL in .env}
      MONITOR_SECRETS_PATH: /run/secrets
    expose:
      - "8080"
      - "4317"
    volumes:
      - monitor_data_protection:/var/lib/monitor/data-protection-keys
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      monitor_backend:
        ipv4_address: 172.31.250.20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - monitor_sqlserver:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      monitor_backend:
        ipv4_address: 172.31.250.30

volumes:
  monitor_sqlserver:
  monitor_data_protection:
  caddy_data:
  caddy_config:

networks:
  monitor_backend:
    ipam:
      config:
        - subnet: 172.31.250.0/24
